<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube-Instagram Bot | SaaS Platform</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-robot"></i>
                <h2>BotPlatform</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-page="youtube">
                    <i class="fab fa-youtube"></i>
                    <span>YouTube</span>
                </a>
                <a href="#" class="nav-item" data-page="instagram">
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                </a>
                <a href="#" class="nav-item" data-page="rumble">
                    <i class="fas fa-video"></i>
                    <span>Rumble</span>
                </a>
                <a href="#" class="nav-item" data-page="engagement">
                    <i class="fas fa-heart"></i>
                    <span>Engagement</span>
                </a>
                <a href="#" class="nav-item" data-page="automation">
                    <i class="fas fa-bolt"></i>
                    <span>Automation</span>
                </a>
                <a href="#" class="nav-item" data-page="scheduler">
                    <i class="fas fa-calendar"></i>
                    <span>Scheduler</span>
                </a>
                <a href="#" class="nav-item" data-page="settings">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page active" id="dashboard">
                <h2>Welcome to BotPlatform</h2>
                <p>Your YouTube-Instagram Bot SaaS Dashboard</p>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon youtube"><i class="fab fa-youtube"></i></div>
                        <div class="stat-content">
                            <span class="stat-label">YouTube Videos</span>
                            <span class="stat-value">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon instagram"><i class="fab fa-instagram"></i></div>
                        <div class="stat-content">
                            <span class="stat-label">Instagram Posts</span>
                            <span class="stat-value">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon rumble"><i class="fas fa-video"></i></div>
                        <div class="stat-content">
                            <span class="stat-label">Rumble Views</span>
                            <span class="stat-value">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
