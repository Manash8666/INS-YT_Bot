[project]
name = "youtube-instagram-bot"
version = "1.0.0"
description = "Production-grade YouTube / Instagram / Rumble automation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core API framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",

    # Data validation
    "pydantic==2.7.4",
    "pydantic-settings==2.3.1",

    # Environment / config
    "python-dotenv==1.0.1",

    # Platform APIs
    "google-api-python-client==2.132.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.0",
    "httpx==0.27.0",

    # Database / migrations
    "SQLAlchemy==2.0.32",
    "alembic==1.13.2",

    # Encryption / security
    "cryptography==43.0.0",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",

    # Media processing
    "Pillow==10.4.0",

    # Async / concurrency
    "anyio==4.4.0",

    # Logging
    "structlog==24.2.0",

    # Testing
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "httpx==0.27.0",
    "hypothesis==6.115.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

[tool.hypothesis]
max_examples = 100
deadline = 5000

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]
